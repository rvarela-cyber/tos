:root {
  --primary: #3498db;
  --dark: #2c3e50;
  --success: #27ae60;
  --muted: #7f8c8d;
  --light: #f8f9fa;
  --danger: #e74c3c;
  --warn: #f39c12;
  --indigo: #667eea;
}
* { box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #fff;
  color: var(--dark);
  margin: 0; padding: 24px;
}
h1 { margin: 0 0 8px; font-size: 28px; color: var(--dark); }
.subtle { color: #6b7280; font-size: 14px; margin-bottom: 20px; }
.grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin: 16px 0 24px;
}
.card {
  background: linear-gradient(180deg, var(--light) 0%, #ffffff 100%);
  border: 1px solid #edf2f7;
  border-radius: 12px;
  padding: 16px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}
.kpi { font-size: 28px; font-weight: 700; color: var(--primary); }
.kpi-label { color: #6b7280; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.toolbar {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  margin: 6px 0 14px;
}
.btn {
  border: 1px solid #e5e7eb; border-radius: 999px; padding: 6px 10px; font-size: 12px;
  background: #fff; color: var(--dark); cursor: pointer;
}
.btn.primary { background: var(--primary); color:#fff; border-color: var(--primary); }
.search {
  margin-left: auto; position: relative;
}
.search input {
  border:1px solid #e5e7eb; border-radius:999px; padding:8px 28px 8px 12px; font-size:13px; width: 280px;
}
.search .icon { position:absolute; right:8px; top:50%; transform:translateY(-50%); font-size:14px; color:#9ca3af; }
.legend {
  display:flex; gap:10px; align-items:center; flex-wrap: wrap; margin: 8px 0 10px;
}
.badge { border-radius:6px; padding:2px 8px; font-size:12px; color:#fff; }
.v20 { background: var(--danger); }
.v15 { background: var(--warn); }
.v10 { background: var(--indigo); }
.v6  { background: var(--primary); }
.v3  { background: var(--success); }
.table-wrap { border:1px solid #e5e7eb; border-radius:12px; overflow:hidden; }
table { width:100%; border-collapse: collapse; font-size: 13px; }
thead th {
  position: sticky; top: 0; z-index: 1; background: var(--primary); color:#fff; text-align:left; padding:10px;
}
tbody td { padding:10px; border-top:1px solid #f3f4f6; }
.visits { font-weight: 700; color: var(--primary); }
.caption { display:flex; justify-content:space-between; align-items:center; margin:10px 0; font-size:12px; color:#6b7280; }
a.export { text-decoration:none; color: var(--primary); font-weight:600; }
@media (max-width: 900px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .search input { width: 200px; }
}

/* === Augmentation: map our interactive UI to the prior theme === */
:root {
  --primary: #3498db;
  --dark: #2c3e50;
  --success: #27ae60;
  --muted: #7f8c8d;
  --light: #f8f9fa;
  --danger: #e74c3c;
  --warn: #f39c12;
  --indigo: #667eea;
}
/* Container look aligned to prior light theme */
.container{max-width:1200px;margin:0 auto;background:#fff;border:1px solid #edf2f7;border-radius:12px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
h1{color:var(--dark)}
.sub{color:#6b7280}
/* KPI cards to match prior cards */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0 24px}
.kpi{font-size:28px;font-weight:700;color:var(--primary)}
.kpi .label{color:#6b7280;font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
/* Toolbar & chips */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid #e5e7eb;border-radius:999px;padding:6px 10px;font-size:12px;background:#fff;color:var(--dark);cursor:pointer}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.search{margin-left:auto;position:relative}
.search input{border:1px solid #e5e7eb;border-radius:999px;padding:8px 28px 8px 12px;font-size:13px;width:280px}
/* Legend pills using the prior color scale */
.pill{border-radius:6px;padding:2px 8px;font-size:12px;color:#fff;display:inline-block}
.pill.p15{background:#7c2d12}
.pill.p14{background:#9a3412}
.pill.p13{background:#b91c1c}
.pill.p12{background:#dc2626}
.pill.p11{background:var(--danger)}
.pill.p9{background:var(--warn)}
.pill.p7{background:var(--indigo)}
.pill.p3{background:var(--primary)}
.pill.p2{background:#6b7280}
/* Table */
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;z-index:1;background:var(--primary);color:#fff;text-align:left;padding:10px}
tbody td{padding:10px;border-top:1px solid #f3f4f6}
/* Count + button */
.counts{font-size:12px;color:#6b7280;margin-left:auto}
.btn{border:1px solid #e5e7eb;border-radius:999px;padding:6px 10px;font-size:12px;background:#fff;color:var(--dark);cursor:pointer}
.btn:hover{filter:brightness(0.98)}
.btn:active{transform:translateY(1px)}
/* CSV primary button variant */
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
a{color:var(--primary);text-decoration:none}
@media (max-width: 900px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .search input{width:200px}
}

</style>

const tbody = document.querySelector("#dataTable tbody");
const searchInput = document.getElementById("searchInput");
const chips = Array.from(document.querySelectorAll(".chip"));
const counts = document.getElementById("counts");
const exportBtn = document.getElementById("exportCsv");

let activeFilter = "all";

function renderTable(data) { 
  tbody.innerHTML = "";
  let html = "";
  data.forEach(r => { 
    html += `
    <tr>
      <td>${r.rank}</td>
      <td>${escapeHtml(r.contact_name)}</td>
      <td>${escapeHtml(r.lead_company)}</td>
      <td>${escapeHtml(r.lead_job_title)}</td>
      <td>${formatLink(r.lead_linkedin_url)}</td>
      <td>${escapeHtml(r.lead_email_work)}</td>
      <td>${escapeHtml(r.lead_phone)}${r.phone_type ? " <span style=\"color:#9ca3af;font-size:11px\">(" + r.phone_type + ")</span>" : ""}</td>
      <td>${escapeHtml(r.lead_phone)}</td>
    </tr>`;
  });
  tbody.innerHTML = html;
  counts.textContent = `Showing ${data.length} of 104 prospects`;
}

function escapeHtml(v){
  if (v == null) return "";
  return String(v).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function formatLink(url){
  if(!url || url === "Not available") return '<span class="muted">Not available</span>';
  let u = String(url).trim();
  if(!/^https?:\/\//i.test(u)) u = "https://" + u.replace(/^\/+/, "");
  return `<a href="${u}" target="_blank" rel="noopener">LinkedIn</a>`;
}

function applyFilter(){
  const q = searchInput.value.trim().toLowerCase();
  let filtered = rows.slice();
  if(activeFilter === "with_company"){
    filtered = filtered.filter(r => r.lead_company && r.lead_company !== "Not available");
  } else if(activeFilter === "with_linkedin"){
    filtered = filtered.filter(r => r.lead_linkedin_url && r.lead_linkedin_url !== "Not available");
  }
  if(q){
    filtered = filtered.filter(r => {
      const hay = [
        r.contact_name, r.lead_company, r.lead_job_title,
        r.lead_email_work, r.lead_phone, r.phone_type
      ].map(v => (v || "").toLowerCase()).join(" ");
      return hay.includes(q);
    });
  }
  renderTable(filtered);
}

chips.forEach(chip => {
  chip.addEventListener("click", () => {
    chips.forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    activeFilter = chip.dataset.filter;
    applyFilter();
  });
});

let debounceTimer = null;
searchInput.addEventListener("input", () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(applyFilter, 150);
});

exportBtn.addEventListener("click", () => {
  const q = searchInput.value.trim().toLowerCase();
  let filtered = rows.slice();
  if(activeFilter === "with_company"){
    filtered = filtered.filter(r => r.lead_company && r.lead_company !== "Not available");
  } else if(activeFilter === "with_linkedin"){
    filtered = filtered.filter(r => r.lead_linkedin_url && r.lead_linkedin_url !== "Not available");
  }
  if(q){
    filtered = filtered.filter(r => {
      const hay = [
        r.contact_name, r.lead_company, r.lead_job_title,
        r.lead_email_work, r.lead_phone, r.phone_type
      ].map(v => (v || "").toLowerCase()).join(" ");
      return hay.includes(q);
    });
  }
  const header = ["Rank","Contact Name","Company","Job Title","LinkedIn URL","Work Email","Phone"];
  const rowsData = filtered.map(r => [
    r.rank, r.contact_name, r.lead_company, r.lead_job_title,
    r.lead_linkedin_url, r.lead_email_work, r.lead_phone, r.lead_phone_alt
  ]);
  const csv = toCSV([header, ...rowsData]);
  const blob = new Blob([csv], {type: "text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "ofp_msl_september_visitors_with_phones.csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

function toCSV(rows){
  return rows.map(r => r.map(cell => {
    let s = String(cell ?? "");
    s = s.replace(/"/g, '""');
    if(/[",\n]/.test(s)) s = `"${s}"`;
    return s;
  }).join(",")).join("\n");
}

applyFilter();
</script>
