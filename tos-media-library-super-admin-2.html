<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>TOS Super Admin Dashboard</title>
</head><body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: same header as the library, then a two-column admin shell: section nav on the left, working area on the right. TOS mint brand, company colors for labels. */
:root{
  --bg:#f3f3f2; --surface:#ffffff; --sunk:#e8e8e6; --line:#d3d3d0; --line-2:#bdbdb9;
  --ink:#1c1c1b; --muted:#6a6a67; --fill:#d6d6d3; --fill-2:#b4b4b0;
  --brand:#a8d5bc; --brand-2:#8fc7a8; --brand-ink:#10241b; --brand-text:#3f8a62; --brand-soft:#e6f3ec;
  --teal:#2a9d8f; --warn:#b45309; --warn-soft:#fdf3e2; --bad:#b42318; --bad-soft:#fdecea; --lock:#4b3f72; --lock-soft:#efecf7;
  --hot:#ff2d87; --hot-ink:#fff; --btn:#1f1f1e; --btn-ink:#fff;
  --c-ALL:#1c1c1b; --c-TOS:#a8d5bc; --c-CSL:#3a72b8; --c-OFP:#3a7d44; --c-TTS:#f5dc45; --c-MSL:#c8302f; --c-FSN:#df6634; --c-OFB:#94334a; --c-PAC:#7f4f9c;
  --font-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151515; --surface:#1f1f1e; --sunk:#292928; --line:#373735; --line-2:#4a4a47; --ink:#ececea; --muted:#9b9b97; --fill:#353533; --fill-2:#4a4a47;
  --brand-soft:#1f2b25; --brand-text:#8fd1b2; --warn-soft:#2e2414; --bad-soft:#2f1a18; --lock-soft:#25222f; --lock:#b9aee6; --warn:#f0b35c; --bad:#f08a80;
  --btn:#ececea; --btn-ink:#151515; --c-ALL:#ececea; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151515; --surface:#1f1f1e; --sunk:#292928; --line:#373735; --line-2:#4a4a47; --ink:#ececea; --muted:#9b9b97; --fill:#353533; --fill-2:#4a4a47;
  --brand-soft:#1f2b25; --brand-text:#8fd1b2; --warn-soft:#2e2414; --bad-soft:#2f1a18; --lock-soft:#25222f; --lock:#b9aee6; --warn:#f0b35c; --bad:#f08a80;
  --btn:#ececea; --btn-ink:#151515; --c-ALL:#ececea; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a,button,.row,.nav-item{transition:background-color .12s,border-color .12s,color .12s,opacity .12s}

/* click hints, same as the library */
[data-hint]{position:relative}
body.hints [data-hint]::before{content:attr(data-hint);position:absolute;top:-11px;right:-8px;z-index:4;background:var(--hot);color:var(--hot-ink);font:700 10px/1 var(--font-ui);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.18);pointer-events:none;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.hint-dock{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--hot);color:var(--hot-ink);border-radius:999px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.22);max-width:calc(100% - 32px)}
.hint-dock button{border:0;background:var(--hot-ink);color:var(--hot);border-radius:999px;padding:5px 12px;font-weight:700;font-size:12px}

/* site header */
.site-top{background:var(--surface);border-bottom:1px solid var(--line-2)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-block:14px;flex-wrap:wrap}
.site-logo{display:block;background:#fff;line-height:0}
.site-logo img{width:clamp(220px,28vw,380px);height:auto}
.top-right{display:flex;align-items:center;gap:clamp(16px,4vw,48px)}
.phone{display:grid;text-align:center;gap:2px}
.phone b{font-weight:400;font-size:clamp(20px,2.3vw,26px)}
.phone span{color:var(--muted);font-size:13px}
.quote{border:0;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:16px;padding:13px 24px;border-radius:2px}
.quote:hover{background:var(--brand-2)}
.adm-bar{background:var(--surface);border-bottom:3px solid var(--brand)}
.adm-bar .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:12px}
.adm-bar h1{font-size:20px}
.role{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--lock-soft);color:var(--lock);border-radius:999px;padding:3px 10px}
.adm-bar .sp{flex:1}
.me{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:12px}

/* buttons */
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--sunk);border-color:var(--ink)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn.teal{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn.teal:hover{filter:brightness(.92)}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.danger:hover{filter:brightness(.92)}
.btn.ghost-danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.ghost-danger:hover{background:var(--bad-soft)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{color:var(--brand-text);text-decoration:underline;text-underline-offset:3px}
.link:hover{opacity:.7}

/* shell */
main{padding-block:24px 96px}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:2px}
.side h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}
.nav-item{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:9px 10px;border-radius:6px;font-weight:500;width:100%}
.nav-item:hover{background:var(--sunk)}
.nav-item[aria-current="true"]{background:var(--brand-soft);color:var(--brand-ink);font-weight:700;box-shadow:inset 3px 0 0 var(--brand-text)}
.nav-item .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
.nav-item .cnt.alert{color:var(--warn);font-weight:600}
body.hints .side .nav-item[data-hint]::before{top:-7px;right:48px}
.nav-item svg{width:16px;height:16px;flex-shrink:0;color:var(--brand-text)}
.side .back{margin-top:6px;border-top:1px solid var(--line);padding-top:10px}

.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h2{font-size:22px;letter-spacing:-.01em}
.head p{margin:2px 0 0;color:var(--muted);max-width:80ch}
.head .sp{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:10px;padding:18px}
.panel+.panel{margin-top:16px}
.panel h3{font-size:16px;margin-bottom:12px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:4px;text-align:left}
button.stat:hover{border-color:var(--ink)}
.stat small{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat b{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.warn{border-left:4px solid var(--warn)}
.stat.lock{border-left:4px solid var(--lock)}
.meter{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--brand-text)}

/* tables */
.tbl-wrap{overflow-x:auto}
body.hints .tbl-wrap{padding-top:8px}
.hw{position:relative;display:inline-flex}
.toolbar .hw:first-child{flex:1;max-width:340px;min-width:220px}.toolbar .hw:first-child input{max-width:none;width:100%}
body.hints .head{padding-top:6px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row:hover td{background:var(--sunk)}
tr.row.sel td{background:var(--brand-soft)}
td.num{font-variant-numeric:tabular-nums;color:var(--muted)}
.t-name{font-weight:600}
.t-sub{font-size:12px;color:var(--muted)}
.co-word{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--co)}
.co-word.TOS{color:var(--brand-text)} .co-word.TTS{color:#9a7d00}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.badge.ok{background:var(--brand-soft);color:var(--brand-text)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.lock{background:var(--lock-soft);color:var(--lock)}
.badge.gray{background:var(--sunk);color:var(--muted)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand-text);margin:0}
select.tier{border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);padding:5px 8px;font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{border:1px solid var(--line-2);border-radius:var(--r);padding:8px 12px;background:var(--surface);min-width:220px;flex:1;max-width:340px}
.toolbar select{border:1px solid var(--line-2);border-radius:var(--r);padding:8px 10px;background:var(--surface)}
.bulkbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);border-radius:8px;padding:10px 14px;margin-bottom:12px}
.bulkbar b{color:var(--bad)}

/* approvals */
.approvals{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;align-items:start}
.q-item{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:left;width:100%}
.q-item+.q-item{margin-top:8px}
.q-item:hover{border-color:var(--ink)}
.q-item[aria-pressed="true"]{border:2px solid var(--brand-text);padding:9px;background:var(--brand-soft)}
.thumb{width:64px;height:64px;border-radius:6px;background:var(--sunk);position:relative;overflow:hidden;display:grid;place-items:center}
.thumb .pg{width:40px;height:52px;background:var(--surface);box-shadow:0 0 0 1px var(--line);display:grid;gap:3px;padding:6px;align-content:start}
.thumb .pg i{height:3px;background:var(--fill);display:block}.thumb .pg i:first-child{height:6px;background:var(--fill-2)}
.thumb .ph{position:absolute;inset:0;background:linear-gradient(160deg,var(--fill),var(--fill-2))}
.thumb .ph::after{content:"";position:absolute;left:10px;right:10px;bottom:8px;height:22px;background:var(--surface);opacity:.5;clip-path:polygon(0 100%,35% 20%,60% 70%,80% 40%,100% 100%)}
.thumb .fmt{position:absolute;left:4px;top:4px;background:var(--surface);border:1px solid var(--line);font-size:9px;font-weight:700;border-radius:3px;padding:0 4px;color:var(--muted)}
.review{position:sticky;top:16px}
.review .big{aspect-ratio:4/3;border-radius:8px;background:var(--sunk);display:grid;place-items:center;margin-bottom:14px;position:relative;overflow:hidden}
.review .big .pg{width:46%;aspect-ratio:8.5/11;background:var(--surface);box-shadow:0 0 0 1px var(--line);padding:6%;display:grid;gap:6px;align-content:start}
.review .big .pg i{height:6px;background:var(--fill);display:block}.review .big .pg i:first-child{height:14px;background:var(--fill-2);width:70%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0 0 14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.checks{display:grid;gap:6px;margin-bottom:14px}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
.check .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;flex-shrink:0}
.check.ok .ic{background:var(--brand);color:var(--brand-ink)}
.check.warn .ic{background:var(--warn-soft);color:var(--warn)}
.note{width:100%;min-height:70px;border:1px solid var(--line-2);border-radius:var(--r);padding:8px 10px;background:var(--surface);resize:vertical;margin-bottom:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.empty{border:1px dashed var(--line-2);border-radius:8px;padding:32px;text-align:center;color:var(--muted)}
.tagline{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px}
.chip.lockc{border-color:color-mix(in srgb,var(--lock) 40%,transparent);background:var(--lock-soft);color:var(--lock)}
button.chip:hover{background:var(--sunk);border-color:var(--ink)}

/* groups */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.group{border:1px solid var(--line);border-left:4px solid var(--lock);border-radius:8px;padding:14px;background:var(--surface);display:grid;gap:6px}
.group b{font-size:15px}
.group .t-sub{min-height:2.6em}
.group .row-btns{display:flex;gap:6px;margin-top:4px}
.lockbox{width:18px;height:18px;border:1.5px solid currentColor;border-radius:4px;display:inline-grid;place-items:center;flex-shrink:0}
.lockbox svg{width:11px;height:11px}

/* activity */
.feed{list-style:none;margin:0;padding:0;display:grid}
.feed li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.feed li:last-child{border-bottom:0}
.feed .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.feed .dot.up{background:var(--brand-soft);color:var(--brand-text)}
.feed .dot.ap{background:var(--brand);color:var(--brand-ink)}
.feed .dot.lk{background:var(--lock-soft);color:var(--lock)}
.feed .dot.rm{background:var(--bad-soft);color:var(--bad)}
.feed .dot.dl{background:var(--sunk);color:var(--muted)}
.feed time{font-size:12px;color:var(--muted);white-space:nowrap}

/* settings */
.setting{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.setting:last-child{border-bottom:0}
.setting b{display:block}.setting span{color:var(--muted);font-size:13px}
.setting select,.setting input[type=number]{border:1px solid var(--line-2);border-radius:var(--r);padding:7px 10px;background:var(--surface)}
.switch{position:relative;width:42px;height:24px;flex-shrink:0}
.switch input{position:absolute;opacity:0;inset:0;cursor:pointer;width:100%;height:100%;margin:0}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--fill-2);pointer-events:none;transition:background .15s}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+i{background:var(--brand-text)}
.switch input:checked+i::after{transform:translateX(18px)}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.modal-box{background:var(--surface);border-radius:12px;max-width:520px;width:100%;padding:24px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:calc(100vh - 32px);overflow:auto}
.modal-box h2{font-size:19px}
.modal-box p{margin:0;color:var(--muted);line-height:1.55}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap}
.pick{display:grid;gap:6px}
.pick label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.pick label:hover{background:var(--sunk)}
.pick label:has(input:checked){border-color:var(--lock);background:var(--lock-soft)}
.pick input{margin-top:3px}
.pick small{display:block;color:var(--muted);font-size:12px}
.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:13.5px}
.field textarea,.field input[type=text]{border:1px solid var(--line-2);border-radius:var(--r);padding:9px 12px;background:var(--surface);width:100%}
.field textarea{min-height:90px;resize:vertical;font-family:var(--font-mono);font-size:12.5px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:8px;font-weight:500;z-index:50;max-width:calc(100% - 32px)}

@media (max-width:1100px){.approvals{grid-template-columns:1fr}.review{position:static}}
@media (max-width:860px){.shell{grid-template-columns:1fr}.side{position:static;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.side h3,.side .back{grid-column:1/-1}}
@media (max-width:560px){.top-right{width:100%;justify-content:space-between}.hide-sm{display:none}}
@media (prefers-reduced-motion:reduce){body.hints [data-hint]::before{animation:none}}
</style>

      <button class="btn sm" data-act="toggleRemoved" data-hint="Click">${showRemoved?'Show Active Users':`Show Removed Users (${users.filter(u=>!u.active).length})`}</button>
    </div>
    ${selCount&&!showRemoved?`<div class="bulkbar"><b>${selCount} selected</b><span class="t-sub" style="flex:1">They’ll be signed out and lose access right away. You can restore them later.</span><button class="btn danger sm" data-act="removeSel" data-hint="Click">Remove Access (${selCount})</button><button class="btn sm" data-act="clearSel">Clear</button></div>`:''}
    <div class="panel" style="padding:0;border-top-width:4px"><div class="tbl-wrap"><table><thead><tr><th style="width:36px">${showRemoved?'':`<input type="checkbox" id="selAll" aria-label="Select all" ${list.length&&list.every(u=>sel.has(u.id))?'checked':''}>`}</th><th>Name</th><th>Company</th><th>Location</th><th>Tier</th><th>Private Groups</th><th>Last Sign-In</th><th></th></tr></thead><tbody>
      ${list.length?list.map((u,ui)=>`<tr class="row ${sel.has(u.id)?'sel':''}"><td ${ui===5?'data-hint="Click"':''}>${showRemoved?'':`<input type="checkbox" data-u="${u.id}" ${sel.has(u.id)?'checked':''} aria-label="Select ${esc(u.name)}">`}</td><td><span class="t-name">${esc(u.name)}</span><br><span class="t-sub">${esc(u.email)}</span></td><td>${coWord(u.co)}</td><td>${u.loc}</td><td ${ui===5?'data-hint="Select"':''}>${showRemoved?esc(u.tier):`<select class="tier" data-tier="${u.id}" aria-label="Tier for ${esc(u.name)}">${['Employee','Manager','Admin','Super Admin'].map(t=>`<option ${u.tier===t?'selected':''}>${t}</option>`).join('')}</select>`}</td><td>${u.groups.length?u.groups.map(g=>`<span class="badge lock">${esc(GROUPS.find(x=>x.id===g).name)}</span>`).join(' '):'<span class="t-sub">None</span>'}</td><td class="num">${u.last}</td><td style="text-align:right">${showRemoved?`<button class="btn sm" data-act="restore" data-u="${u.id}" ${ui===0?'data-hint="Click"':''}>Restore Access</button>`:`<button class="btn sm ghost-danger" data-act="removeOne" data-u="${u.id}" ${ui===5?'data-hint="Click"':''}>Remove</button>`}</td></tr>`).join(''):`<tr><td colspan="8"><div class="empty" style="margin:12px">No users match.</div></td></tr>`}
    </tbody></table></div></div>`;
  }
  if(view==='source'){
    V.innerHTML=`<div class="head"><div><h2>Source Files (${sourceFiles.length})</h2><p>Editable design files (InDesign, Illustrator, Photoshop, XD). Only Super Admins can upload or download these, and every download is logged.</p></div><span class="sp"></span><button class="btn teal" data-hint="Click" data-toast="Wireframe: opens the upload form with Source Files selected">+ Upload Source File</button></div>
    <div class="panel"><div class="tbl-wrap"><table><thead><tr><th>File</th><th>Company</th><th>Formats</th><th>Size</th><th>Added</th><th></th></tr></thead><tbody>
    ${sourceFiles.map((f,fi)=>`<tr class="row"><td><span class="t-name"><span class="lockbox" style="color:var(--lock);margin-right:8px;vertical-align:-3px">${LOCK}</span>${esc(f.t)}</span></td><td>${coWord(f.co)}</td><td>${f.f}</td><td class="num">${f.s}</td><td class="num">${f.d}</td><td style="text-align:right"><button class="btn sm primary" ${fi===0?'data-hint="Click"':''} data-toast="Wireframe: download is logged with your name and time">Download</button></td></tr>`).join('')}
    </tbody></table></div></div>`;
  }
  if(view==='activity'){
    V.innerHTML=`<div class="head"><div><h2>Activity Log</h2><p>Every upload, approval, privacy change, source file download and access change, with who did it and when.</p></div><span class="sp"></span><button class="btn" data-hint="Click" data-toast="Wireframe: downloads the log as a CSV file">Export CSV</button></div>
    <div class="panel"><ul class="feed">${activity.map(feedRow).join('')}</ul></div>`;
  }
  if(view==='settings'){
    V.innerHTML=`<div class="head"><div><h2>Settings</h2><p>Library-wide rules. Only Super Admins can change these.</p></div></div>
    <div class="panel">
      <div class="setting"><div><b>Recently Added Window</b><span>How long new files stay in Recently Added.</span></div><span class="hw" data-hint="Select"><select id="sWin">${[7,14,30,60,90].map(n=>`<option value="${n}" ${settings.window===n?'selected':''}>${n} days</option>`).join('')}</select></span></div>
      <div class="setting"><div><b>Two-Step Approval for Source Files</b><span>One Super Admin checks the file, a second checks the content.</span></div><label class="switch" data-hint="Click"><input type="checkbox" id="sTwo" ${settings.twoStep?'checked':''} aria-label="Two-step approval"><i></i></label></div>
      <div class="setting"><div><b>Managers Can Suggest New Tags</b><span>New tags are approved together with the upload.</span></div><label class="switch" data-hint="Click"><input type="checkbox" id="sTags" ${settings.mgrTags?'checked':''} aria-label="Managers can suggest tags"><i></i></label></div>
      <div class="setting"><div><b>Email Link Expiration</b><span>How long a link sent to someone outside TOS keeps working.</span></div><span class="hw" data-hint="Select"><select id="sExp">${[7,14,30,90].map(n=>`<option value="${n}" ${settings.expiry===n?'selected':''}>${n} days</option>`).join('')}</select></span></div>
      <div class="setting"><div><b>Remove Access When Someone Leaves the Company Email System</b><span>Happens automatically through single sign-on.</span></div><label class="switch"><input type="checkbox" checked aria-label="Automatic removal"><i></i></label></div>
    </div>
    <div style="margin-top:14px"><button class="btn primary" data-hint="Click" data-toast="Settings saved">Save Settings</button></div>`;
  }
}
const feedRow=([k,txt,when])=>`<li><span class="dot ${k}">${k==='ap'?'✓':k==='up'?'+':k==='lk'?LOCK:k==='rm'?'−':'↓'}</span><div>${esc(txt)}</div><time>${esc(when)}</time></li>`;

/* ---------- modal ---------- */
let onOk=null;
function modal(title,body,okLabel,okClass,fn,cancel=true){
  document.getElementById('mT').textContent=title; document.getElementById('mB').innerHTML=body;
  document.getElementById('mA').innerHTML=`<button class="btn ${okClass||'primary'}" data-mok data-hint="Click">${okLabel}</button>${cancel?'<button class="btn" data-mclose>Cancel</button>':''}`;
  onOk=fn; document.getElementById('modal').hidden=false; setTimeout(()=>document.querySelector('#mA [data-mok]').focus(),0);
}
const closeModal=()=>{document.getElementById('modal').hidden=true;onOk=null};
const groupPicker=(checked=[])=>`<div class="pick">${GROUPS.map((g,gi)=>`<label ${gi===0?'data-hint="Click"':''}><input type="checkbox" name="grp" value="${g.id}" ${checked.includes(g.id)?'checked':''}><span><b>${esc(g.name)}</b><small>${g.members.length} members: ${g.members.map(esc).join(', ')}</small></span></label>`).join('')}</div>`;
const pickedGroups=()=>[...document.querySelectorAll('#mB input[name=grp]:checked')].map(i=>i.value);
function removeUsers(ids,how){
  const n=ids.length; ids.forEach(id=>{const u=users.find(x=>x.id===id); if(u) u.active=false; sel.delete(id)});
  activity.unshift(['rm',`Michael Monette removed access for ${n} user${n>1?'s':''}${how?' ('+how+')':''}`,'Just now']);
  toast(`Access removed for ${n} user${n>1?'s':''}. They’re signed out now.`); render();
}

/* ---------- toast ---------- */
let tt; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}

/* ---------- events ---------- */
function go(v){view=v;try{history.replaceState(null,'','#'+v)}catch(_){location.hash=v}render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{
  const el=e.target.closest('button,a'); if(!el) return; const d=el.dataset;
  if('mclose' in d){closeModal();return}
  if('mok' in d){const f=onOk; if(f&&f()===false) return; closeModal(); return}
  if(d.toast){e.preventDefault();toast(d.toast);return}
  if(d.go){ if(d.pick) selQ=+d.pick; if(d.filter==='stale'){utier='stale';showRemoved=false} go(d.go); return}
  if(d.q){selQ=+d.q;render();return}
  const q=queue.find(x=>x.id===selQ);
  if(d.act==='approve'){
    const priv=document.getElementById('qPrivate').checked;
    const finish=(groups)=>{queue.splice(queue.indexOf(q),1); if(groups){privateDocs.unshift({id:Date.now(),title:q.title,cat:q.cat,co:q.co,groups,by:'Michael Monette',date:'11/2/26'})}
      activity.unshift(['ap',`Michael Monette approved “${q.title}”${groups?' as Private':''}`,'Just now']); toast(groups?'Approved and published as Private.':'Approved. It’s live in the library and in Recently Added.'); render();};
    if(!q.integrity){modal('This File Didn’t Pass the File Check',`<p>${esc(q.issue)} Publish it anyway, or send it back so ${esc(q.by)} can fix it.</p>`,'Publish Anyway','primary',()=>{if(priv){setTimeout(()=>askGroups(finish),0)}else finish(null)});return}
    if(priv){askGroups(finish);return}
    finish(null); return;
  }
  if(d.act==='back'||d.act==='reject'){
    const note=document.getElementById('qNote').value.trim();
    if(!note){toast('Add a note so the uploader knows what to change.');document.getElementById('qNote').focus();return}
    queue.splice(queue.indexOf(q),1); activity.unshift([d.act==='back'?'up':'rm',`Michael Monette ${d.act==='back'?'sent back':'rejected'} “${q.title}”`,'Just now']);
    toast(d.act==='back'?`Sent back to ${q.by} with your note.`:`Rejected. ${q.by} will see your note in My Uploads.`); render(); return;
  }
  if(d.act==='newPrivate'){
    modal('Make a Document Private',`<div class="field"><label for="pDoc">Document</label><input type="text" id="pDoc" placeholder="Start typing a document name, e.g. Payroll Deduction Form" value="Payroll Deduction Form"></div><div class="field"><label>Who Can See It</label>${groupPicker(['hr'])}</div>`,'Make Private','primary',()=>{
      const g=pickedGroups(); const name=document.getElementById('pDoc').value.trim(); if(!g.length||!name){toast('Pick a document and at least one group.');return false}
      privateDocs.unshift({id:Date.now(),title:name,cat:'Employee Manual with User Forms',co:'ALL',groups:g,by:'Michael Monette',date:'11/2/26'}); activity.unshift(['lk',`Michael Monette marked “${name}” as Private`,'Just now']); toast('Done. Only those groups can see it now.'); render();}); return;
  }
  if(d.act==='changeAccess'){const doc=privateDocs.find(x=>x.id===+d.d);
    modal('Change Who Can See It',`<p><b style="color:var(--ink)">${esc(doc.title)}</b></p>${groupPicker(doc.groups)}`,'Save','primary',()=>{const g=pickedGroups(); if(!g.length){toast('Pick at least one group, or use Make Public.');return false} doc.groups=g; toast('Access updated.'); render();}); return;}
  if(d.act==='makePublic'){const doc=privateDocs.find(x=>x.id===+d.d);
    modal('Make This Document Public?',`<p>“${esc(doc.title)}” will show up for every employee who can see this category.</p>`,'Make Public','primary',()=>{privateDocs.splice(privateDocs.indexOf(doc),1); toast('It’s visible to everyone now.'); render();}); return;}
  if(d.act==='editGroup'){const g=GROUPS.find(x=>x.id===d.g);
    modal(`Edit ${g.name}`,`<div class="field"><label for="gMem">Members (one per line)</label><textarea id="gMem">${g.members.map(esc).join('\n')}</textarea></div>`,'Save Members','primary',()=>{g.members=document.getElementById('gMem').value.split('\n').map(s=>s.trim()).filter(Boolean); toast('Members saved.'); render();}); return;}
  if(d.act==='newGroup'){modal('New Access Group',`<div class="field"><label for="ngName">Group Name</label><input type="text" id="ngName" placeholder="e.g. Payroll"></div><div class="field"><label for="ngMem">Members (one per line)</label><textarea id="ngMem" placeholder="Amy&#10;Megan"></textarea></div>`,'Create Group','primary',()=>{const n=document.getElementById('ngName').value.trim(); if(!n){toast('Give the group a name.');return false} GROUPS.push({id:'g'+Date.now(),name:n,desc:'Custom access group.',members:document.getElementById('ngMem').value.split('\n').map(s=>s.trim()).filter(Boolean)}); toast('Group created.'); render();}); return;}
  if(d.act==='removeOne'){const u=users.find(x=>x.id===+d.u);
    modal(`Remove Access for ${u.name}?`,`<p>They’ll be signed out right away and won’t be able to open the library. Their uploads stay in the library. You can restore access later.</p>`,'Remove Access','danger',()=>removeUsers([u.id])); return;}
  if(d.act==='removeSel'){const ids=[...sel];
    modal(`Remove Access for ${ids.length} Users?`,`<p>They’ll be signed out right away. Their uploads stay in the library. You can restore access later from Removed Users.</p>`,`Remove Access (${ids.length})`,'danger',()=>removeUsers(ids)); return;}
  if(d.act==='bulkPaste'){
    modal('Bulk Remove Access',`<p>Use this when a group of people leaves at once. Paste their work emails, or remove everyone in one company and location.</p>
      <div class="field"><label for="bpEmails">Work Emails (one per line)</label><textarea id="bpEmails" placeholder="name@tospartners.com"></textarea></div>
      <div class="field"><label>Or Everyone In</label><div style="display:flex;gap:8px;flex-wrap:wrap"><select id="bpCo" style="border:1px solid var(--line-2);border-radius:6px;padding:8px"><option value="">Pick a company</option>${Object.keys(CO).filter(k=>k!=='ALL').map(k=>`<option value="${k}">${CO[k]}</option>`).join('')}</select><select id="bpLoc" style="border:1px solid var(--line-2);border-radius:6px;padding:8px"><option value="">Any location</option><option>Dallas</option><option>Austin</option><option>San Antonio</option></select></div></div>
      <p class="t-sub">Super Admins are never removed by bulk actions.</p>`,'Review and Remove','danger',()=>{
        const emails=document.getElementById('bpEmails').value.toLowerCase().split(/[\s,;]+/).filter(Boolean); const co=document.getElementById('bpCo').value, loc=document.getElementById('bpLoc').value;
        let ids=users.filter(u=>u.active&&u.tier!=='Super Admin'&&(emails.includes(u.email.toLowerCase())||(co&&u.co===co&&(!loc||u.loc===loc)))).map(u=>u.id);
        if(!ids.length){toast('No matching active users. Check the emails or pick a company.');return false}
        setTimeout(()=>modal(`Remove Access for ${ids.length} Users?`,`<p>${ids.slice(0,8).map(id=>esc(users.find(u=>u.id===id).name)).join(', ')}${ids.length>8?` and ${ids.length-8} more`:''}</p><p>They’ll be signed out right away.</p>`,`Remove Access (${ids.length})`,'danger',()=>removeUsers(ids,co?`${CO[co]}${loc?', '+loc:''}`:'bulk list')),0);
      }); return;
  }
  if(d.act==='restore'){const u=users.find(x=>x.id===+d.u); u.active=true; activity.unshift(['ap',`Michael Monette restored access for ${u.name}`,'Just now']); toast(`${u.name} has access again.`); render(); return;}
  if(d.act==='toggleRemoved'){showRemoved=!showRemoved;sel.clear();render();return}
  if(d.act==='clearSel'){sel.clear();render();return}
  if(d.act==='addUser'){modal('Add a User',`<div class="field"><label for="auE">Work Email</label><input type="text" id="auE" placeholder="name@tospartners.com"></div><p class="t-sub">Most people are added automatically the first time they sign in with their company email. New users start as Employee.</p>`,'Add User','primary',()=>{const em=document.getElementById('auE').value.trim(); if(!em.includes('@')){toast('Enter a work email.');return false} users.unshift({id:Date.now(),name:em.split('@')[0],email:em,co:'TOS',loc:'Dallas',tier:'Employee',groups:[],last:'Never',active:true}); toast('User added as Employee.'); render();}); return;}
  if(el.id==='hintBtn'){const on=document.body.classList.toggle('hints');el.textContent=on?'Hide tags':'Show tags';el.previousElementSibling.textContent=on?'Clickable prototype: pink tags show where to click':'Click tags hidden';return}
});
function askGroups(finish){ modal('Who Can See This Private Document?',groupPicker(['hr']),'Approve as Private','primary',()=>{const g=pickedGroups(); if(!g.length){toast('Pick at least one group.');return false} finish(g)}); }
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.u&&t.type==='checkbox'){const id=+t.dataset.u; t.checked?sel.add(id):sel.delete(id); render(); return}
  if(t.id==='selAll'){const vis=[...document.querySelectorAll('input[data-u]')].map(i=>+i.dataset.u); vis.forEach(id=>t.checked?sel.add(id):sel.delete(id)); render(); return}
  if(t.dataset.tier){const u=users.find(x=>x.id===+t.dataset.tier); u.tier=t.value; toast(`${u.name} is now ${t.value}.`); activity.unshift(['ap',`Michael Monette changed ${u.name} to ${t.value}`,'Just now']); return}
  if(t.id==='uco'){uco=t.value;render();return}
  if(t.id==='utier'){utier=t.value;render();return}
  if(t.id==='sWin') settings.window=+t.value;
});
let qt; document.addEventListener('input',e=>{if(e.target.id==='uq'){clearTimeout(qt);const v=e.target.value;qt=setTimeout(()=>{uq=v;render();const i=document.getElementById('uq');i.focus();i.setSelectionRange(v.length,v.length)},200)}});
addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

document.body.classList.add('hints');
const h=location.hash.slice(1); if(['overview','approvals','private','users','source','activity','settings'].includes(h)) view=h;
render();
})();
</script>

</body></html>
